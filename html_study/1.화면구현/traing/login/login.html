<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 UI</title>
    <!-- CSS 파일을 연결하여 디자인 적용,
      처음에 href="style.css" 주소가 안맞아서 적용이 안됐다. 
      폴더를 하나로 합치니까 적용됨;;;  -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 로그인 폼 전체를 감싸는 컨테이너 -->
    <div class="login-container">
        <h2>로그인</h2>
        <!-- 아이디 입력 -->
        <div class="input-group">
            <label for="userId">아이디</label>
            <input type="text" id="userId" placeholder="아이디를 입력하세요">
        </div>
        <!-- 비밀번호 입력 -->
        <div class="input-group">
            <label for="userPassword">비밀번호</label>
            <input type="password" id="userPassword" placeholder="비밀번호를 입력하세요">
        </div>
        <!-- 로그인 버튼 -->
        <button id="loginButton">로그인</button>
        
        <!-- 아이디/비밀번호 찾기 -->
         <!-- 아이디/비밀번호 찾기 링크 영역 -->
        <div class="links">
            <!-- 계정을 찾는 페이지로 이동, 
             여기도 마찬가지;; 파일문제 파일구조를 합쳐서 완성 -->
            <a href="find_account.html">아이디/비밀번호 찾기</a>
        </div>
        <!-- 로그인 결과(JS로 제어) -->
        <p id="messageArea"></p>
    </div>
        <!-- JavaScript 파일소스 -->
    <script src="script.js"></script>
</body>
</html>
