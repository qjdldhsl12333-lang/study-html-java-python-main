<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계정 찾기</title>
    <link rel="stylesheet" href="find_style.css">
</head>

<body>
    <!-- 계정 찾기 -->
    <div class="find-container">
        <h2>계정 찾기</h2>
        <p>이름과 나이를 입력하여 계정을 찾습니다.</p>
        <!-- 이름 입력 -->
        <div class="input-group">
            <label for="userName">이름</label>
            <input type="text" id="userName" placeholder="이름을 입력하세요">
        </div>
        <!-- 나이 입력 -->
        <div class="input-group">
            <label for="userAge">나이</label>
            <input type="number" id="userAge" placeholder="나이를 입력하세요">
        </div>
        <!-- 정보 확인 버튼 -->
        <button id="findButton">계정 정보 확인</button>
        <!-- 로그인 페이지 링크 -->
        <div class="links">
            <a href="login.html">로그인 페이지로 돌아가기</a>
        </div>

        <!-- 결과를 표시 -->
        <p id="messageArea"></p>
    </div>
    <!-- find_script.js 파일 연결 -->
    <script src="find_script.js"></script>
</body>

</html>
