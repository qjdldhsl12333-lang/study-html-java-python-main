<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
body {
  font-family: 'Pretendard', sans-serif;
  background: #f8f9fa;
  text-align: center;
  line-height: 1.6;
}

/* 중앙 기준 박스 */
.base-box {
  width: 200px;
  height: 80px;
  background: #0984e3;
  color: white;
  line-height: 80px;
  margin: 40px auto;
  border-radius: 8px;
  box-shadow: 0 0 5px rgba(0,0,0,0.2);
}

/* 방향별 margin 적용 */
.box-top {
  margin-top: 60px; /* 위로 공간 */
  background: #74b9ff;
}

.box-bottom {
  margin-bottom: 60px; /* 아래로 공간 */
  background: #00cec9;
}

.box-left {
  margin-left: 100px; /* 왼쪽으로 밀림 */
  background: #6c5ce7;
}

.box-right {
  margin-right: 100px; /* 오른쪽으로 밀림 */
  background: #fd79a8;
}
</style>
<body>
  <h2>모든 방향 margin 실습 예제</h2>
  <div class="base-box box-top">margin-top: 60px</div>
  <div class="base-box box-right">margin-right: 100px</div>
  <div class="base-box box-bottom">margin-bottom: 60px</div>
  <div class="base-box box-left">margin-left: 100px</div>
</body>
</body>
</html>
