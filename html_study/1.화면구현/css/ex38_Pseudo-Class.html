<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>동적 의사 클래스</title>
<style>
  a:link {
    color: #3498db;
  }

  a:visited {
    color: #9b59b6;
  }

  a:hover {
    color: #e67e22;
    text-decoration: underline;
  }

  a:active {
    color: #e74c3c;
  }

  input:focus {
    border: 2px solid #2ecc71;
    outline: none;
  }
</style>
</head>
<body>
  <h2>동적 의사 클래스 예제</h2>
  <a href="https://example.com" target="_blank">Example 링크</a>
  <br><br>
  <input type="text" placeholder="여기에 포커스를 맞춰보세요">
</body>
</html>
