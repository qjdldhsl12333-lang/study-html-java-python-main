<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 함수 앞에 async 키워드를 붙이면 자동으로 비동기함수가 된다.
        // 비동기 함수의 결과는 항상 promise 객체를 반환된다.
        async function fetchData() {
            return '데이터';
        }
        fetchData().then(data => console.log(data));
        // await 
        // 비동기 함수에서만 사용할 수있으며, promise가 처리될 때까지
        // 함수의 실행을 일시 중지 시킨다.
        async function fetchData2() {
            // 다른서버에 데이터를 달라고 요청
            const response = await fetch('https://jsonplaceholder.typicode.com/posts');
            const data = await response.json(); //JSoN형태로 변환
            return data;
        }
        
        fetchData2()
            .then(posts => console.log(posts))
            // 통신이 성공하면 then으로 이동
            .catch(error => {
                alert('에러가 발생했습니다')
                console.log(error.name)
            });
            // 통신이 실패하면 catch로 이동
    </script>
</body>

</html>
