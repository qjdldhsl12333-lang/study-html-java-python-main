<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // 조건식 ? 조건이 참일때 : 조건이 거짓일때
        // 변수값 >= 변수값 , 변수값 <= 변수값 ? "입력값" : "입력값" ;
        let score = 100;
        let result = score <= 90 ? "합격" : "불합격";
        // 위 예시는 보기편하기위해 자료형으로 넣은것 타입은 상관X 
        console.log(result);

        //  조건이 여러개일때 (중첩 삼항 연산자)
        let grade = score >= 90 ? "A" : score >= 80 ? "B" : score >= 70 ? "c" : score >= 60 ? "D" : "F"
        console.log(grade)
    </script>
</head>
