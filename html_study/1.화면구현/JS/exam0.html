<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul {
            /* 부모속성에 타입을준다*/
            display: flex;
            gap: 10px;
            list-style: none;
        }

        input {
            /*인풋 타입*/
            border: none;
        }
    </style>
    <script>
        // 계산기 js
        function calc(op) {
            // document.querySelector ("#su1").value; 문자열;;;
                
            let su1 = Number(document.querySelector("#su1").value);
            let su2 = Number(document.querySelector("#su2").value);
            
            let result = document.querySelector("#result");
            switch (op) {
                case '+':
                    result.value = su1 + su2;
                    break;
                case '-':
                    result.value = su1 - su2;
                    break;
                case '*':
                    result.value = su1 * su2;
                    break;
                case '/':
                    result.value = su1 / su2;
                    break;
            }

        }
    </script>
</head>


<body>
    <table border="1">
        <!-- <tr>하나의 행 -->
        <tr>
            <th>수1</th>
            <td><input id="su1"></td>
        </tr>
        <tr>
            <th>수2</th>
            <td><input id="su2"></td>
        </tr>
        <tr>
            <!-- colspan="숫자" 칸늘리기 -->
            <td colspan="2">
                <ul>
                    <li><input type="button" id="plus" value="+" onclick="calc('+')"></li>
                    <li><input type="button" id="minus" value="-" onclick="calc('-')"></li>
                    <li><input type="button" id="multi" value="*" onclick="calc('*')"></li>
                    <li><input type="button" id="div" value="/" onclick="calc('/')"></li>
                </ul>
            </td>
        </tr>
        <tr>
            <th>결과</th>
            <td><input id="result"></td>
        </tr>


    </table>
    <script>

    </script>
</body>

</html>
