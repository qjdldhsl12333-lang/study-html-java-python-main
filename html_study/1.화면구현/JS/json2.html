<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <label>이름 :</label>
    <input type="text" id="nameinput"><br>
    <label>나이 :</label>
    <input type="text" id="ageinput"><br>

    <button onclick="addUser()">JSON에 저장하기</button>

    <script>
        const users = [];
        let addUser = () => {
            // <input>,<textarea>,<select>만
            //  (value) 프로퍼티를 통해 값을 가져올 수 있다.
            let name = document.querySelector('#nameinput').value;
            let age = document.querySelector('#ageinput').value;

            // 입력한 값으로 JSON객체 생성
            let newUser ={
                "name": name,
                "age": age
            }
            // users배열에 추가
            users.push(newUser);

            // 서버로 보내기....
            console.log(users);

        }


    </script>

</body>

</html>
