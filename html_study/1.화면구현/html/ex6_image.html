<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image ex</title>
</head>
<body>
   <!--../ : 현위치에서 상위로 이동 -->
   <!-- 이미지 태그는 닫는태그없이 사용가능 ex:(/x) -->
    <!-- 이미지를 다는태그 img src 이미지태그후 소스입력 -->
    <img src="../image/cat.png" alt="고영희"
    width="200">
   <!-- 주소를 통해서도 이미지를 넣을수 있다. -->
    <img src="https://w7.pngwing.com/pngs/802/825/png-transparent-redbubble-polite-cat-meme-funny-cat-meme-thumbnail.png"
     alt="고영희" width="200">
    
    <!-- inline 속성은 너비와 높이를 조절할수없다.
     단, 이미지 태그는 가능하다. -->
</body>
</html>
