<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list ex</title>
</head>
<body>
    <!-- 리스트를 만드는것 로마자, 동그란점, 네모난점, 숫자, 영어 가능-->
     <!-- 리스트를 만들면 정리하기쉽다 목차를 만드는개념 -->
    <!-- 순서가 없는 리스트 -->
     <!-- 스타일정하기 "list-style-type"
     disc 기본 값,둥근 점
     circle 책이 미워진 둥근점
     square 사각형 모양점
     none 구분 값 없음(빈 칸)
     -->
    <ul style=" list-style-type:circle"> 
        <li>홍길동</li>
        <li>봉길동</li>
        <li>창길동</li>
    </ul>
    <!-- 순서가 정해진 리스트 -->
     <!-- type="" 
      1: 숫자
      A:알파벳 대문자
      a:알파벳 소문자
      I:로마자 대문자
      i:로마자 소문자
      -->
     <ol type="i" start="3" reversed>
        <li>물을 끓인다.</li>
        <li>스프를 넣는다.</li>
        <li>면을 넣는다.</li>
     </ol>
     <ul style="list-style-type: none;">
        <li><a href= "#">개인뱅킹</a>
            <ul style="list-style-type: none;">
                <li>조회</li>
                <li>이체</li>
                <li>신규/해지</li>
           </ul>
        </li>
     </ul>
</body>
</html>
