<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>div ex</title>
</head>
<body>
    <!-- div는 특정 영역별로 묶어서 
     표이해야 할 태그들을 하나의 영역으로 합쳐서 
     관리할 수 있도록 해주는 태그(자주사용)
     리스트랑은 조금다름 href를 넣어 버튼식으로 활용
      -->
    <div>
        <a href="#">메뉴1</a>
        <a href="#">메뉴2</a>
        <a href="#">메뉴3</a>
    </div>
    <div>
        <a href="#">메뉴4</a>
        <a href="#">메뉴5</a>
        <a href="#">메뉴6</a>
    </div>
</body>
</html>
