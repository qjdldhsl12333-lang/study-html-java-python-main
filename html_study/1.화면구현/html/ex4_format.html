<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>format ex</title>
</head>
<body>
    <!-- 포멧아님 글자를꾸미기위한 -->
    <!-- <br /> 문단나누기(태그에 얽메이지않음) -->
    글꼴 <br />
    <b>글자를 두껍게</b><br />
    <strong>글자를 두껍게</strong><br />
    <i>글자 기울기</i><br />
    <em>글자 기울기</em><br />
    <p>
        My favorite color is <del>blue</del>red
    </p>
    <p>HTML <small>Small</small> Formatting
    </p>
    <p>
        This is<sub>subscripted</sub>Text
    </p>
    <p>
        This is<sup>subscripted</sup>Text
    </p>
</body>
</html>
